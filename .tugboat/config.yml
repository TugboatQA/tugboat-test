services:
    apache:
        image: tugboatqa/httpd
        aliases: test
        http: true
        https: false
        commands:
            init:
                - echo "********** INIT **********"
                - ln -snf "${TUGBOAT_ROOT}" "${DOCROOT}"
            update:
                - echo "********** UPDATE **********"
            build:
                - echo "********** BUILD **********"
                - cat .tugboat/tugboat.txt
        lighthouse:
            enabled: true
            screen:
                - desktop
        urls:
            - /
            - /page-1/
            - /page-2/
            - /page-3/
            - /page-4/
