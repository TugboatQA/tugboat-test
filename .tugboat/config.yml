services:
    web-a:
        default: true
        image: tugboatqa/httpd
        http: true
        https: false
        commands:
            init:
                - echo "********** INIT web-a **********"
                - ln -snf "${TUGBOAT_ROOT}" "${DOCROOT}"
            update:
                - echo "********** UPDATE web-a **********"
            build:
                - echo "********** BUILD web-a **********"
        urls:
            - /
        visualdiff:
            enabled: true
            threshold: 90

    web-b:
        image: tugboatqa/httpd
        http: true
        https: false
        expose: 80
        commands:
            init:
                - echo "********** INIT web-b **********"
                - ln -snf "${TUGBOAT_ROOT}" "${DOCROOT}"
            update:
                - echo "********** UPDATE web-b **********"
            build:
                - echo "********** BUILD web-b **********"
        urls:
            - /
        visualdiff:
            enabled: true
            threshold: 90
