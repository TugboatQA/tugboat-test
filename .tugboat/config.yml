services:
    apache:
        image: tugboatqa/httpd
        http: true
        https: false
        commands:
            init:
                - echo "********** INIT **********"
                - apt-get update
                - apt-get install bsd-mailx
                - rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
                - ln -snf "${TUGBOAT_ROOT}" "${DOCROOT}"
            update:
                - echo "********** UPDATE **********"
            build:
                - echo "********** BUILD **********"
        lighthouse:
            enabled: true
            threshold: 70
        urls:
            - /
    mysql:
        image: tugboatqa/mysql
