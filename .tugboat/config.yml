services:
    gated:
        default: true
        image: tugboatqa/httpd
        http: true
        https: false
        commands:
            init:
                - echo "********** INIT **********"
                - ln -snf "${TUGBOAT_ROOT}" "${DOCROOT}"
            update:
                - echo "********** UPDATE **********"
            build:
                - echo "********** BUILD **********"
        lighthouse:
            enabled: true
            threshold: 90
        urls:
            - /slow/
    ungated:
        image: tugboatqa/httpd
        http: true
        https: false
        expose: 80
        commands:
            init:
                - echo "********** INIT **********"
                - ln -snf "${TUGBOAT_ROOT}" "${DOCROOT}"
            update:
                - echo "********** UPDATE **********"
            build:
                - echo "********** BUILD **********"
        lighthouse:
            enabled: true
            threshold: 0
        urls:
            - /
