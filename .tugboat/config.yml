services:
  elasticsearch:
    image: tugboatqa/elasticsearch:8.18.8
    http: true
    https: false
    commands:
      build:
        - |
          cat > /usr/share/tugboat/elasticsearch.yml << 'EOF'
          network.host: 0.0.0.0
          discovery.type: single-node
          xpack.security.enabled: false
          xpack.security.enrollment.enabled: false
          EOF
