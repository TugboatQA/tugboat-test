services:
    go:
        image: tugboatqa/alpine
        aliases: test
        http: true
        https: false
        commands:
            init:
                - apk add --no-cache --virtual .build-deps runit bash gcc musl-dev openssl go bsd-mailx
                - mkdir -p /etc/service/server
                - cp "${TUGBOAT_ROOT}/.tugboat/runit/server/run" /etc/service/server/run
                - chmod +x /etc/service/server/run
            update:
                - echo "********** UPDATE **********"
            build:
                - echo "********** BUILD **********"
                - cd ${TUGBOAT_ROOT}/server && go build -o server .
                - cat .tugboat/tugboat.txt | mail -s "[1] Tugboat Preview ${TUGBOAT_PREVIEW_ID}" tugboat@example.com
                - cat .tugboat/tugboat.txt | mail -s "[2] Tugboat Preview ${TUGBOAT_PREVIEW_ID}" tugboat@example.com
                - cat .tugboat/tugboat.txt
