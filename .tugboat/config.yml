services:
    marketing:
        default: true
        image: tugboatqa/httpd
        http: true
        https: false
        commands:
            init:
                - echo "********** INIT **********"
                - ln -snf "${TUGBOAT_ROOT}" "${DOCROOT}"
            update:
                - echo "********** UPDATE **********"
            build:
                - echo "********** BUILD **********"
        lighthouse:
            enabled: true
            threshold: 80
        urls:
            - /
    app:
        image: tugboatqa/httpd
        http: true
        https: false
        expose: 80
        commands:
            init:
                - echo "********** INIT **********"
                - ln -snf "${TUGBOAT_ROOT}" "${DOCROOT}"
            update:
                - echo "********** UPDATE **********"
            build:
                - echo "********** BUILD **********"
        lighthouse:
            enabled: true
            threshold: performance
        urls:
            - /
            - /slow/
    docs:
        image: tugboatqa/httpd
        http: true
        https: false
        expose: 80
        commands:
            init:
                - echo "********** INIT **********"
                - ln -snf "${TUGBOAT_ROOT}" "${DOCROOT}"
            update:
                - echo "********** UPDATE **********"
            build:
                - echo "********** BUILD **********"
        lighthouse:
            enabled: true
            threshold:
                - category: seo
                  threshold: 90
                - category: accessibility
                  threshold: 90
        urls:
            - /
            - /seo-bad/
            - /a11y-bad/
