services:
    web:
        default: true
        image: tugboatqa/httpd
        http: true
        https: false
        commands:
            init:
                - echo "********** INIT **********"
                - ln -snf "${TUGBOAT_ROOT}" "${DOCROOT}"
            update:
                - echo "********** UPDATE **********"
            build:
                - echo "********** BUILD **********"
        lighthouse:
            enabled: true
            threshold: base
        urls:
            - /
            - /slow/
    web-v2:
        image: tugboatqa/httpd
        http: true
        https: false
        expose: 80
        commands:
            init:
                - echo "********** INIT **********"
                - ln -snf "${TUGBOAT_ROOT}" "${DOCROOT}"
            update:
                - echo "********** UPDATE **********"
            build:
                - echo "********** BUILD **********"
        lighthouse:
            enabled: true
            threshold: performance
        urls:
            - /
            - /slow/
