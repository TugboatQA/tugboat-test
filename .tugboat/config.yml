services:
    apache:
        image: tugboatqa/httpd
        aliases: test
        http: true
        https: false
        commands:
            init:
                - echo "********** INIT **********"
                - ln -snf "${TUGBOAT_ROOT}" "${DOCROOT}"
            update:
                - echo "********** UPDATE **********"
            build:
                - echo "********** BUILD **********"
                - cat .tugboat/tugboat.txt
        lighthouse:
            enabled: true
        urls:
            - url: /mediocre/
              lighthouse:
                  threshold:
                      threshold: 80
                      tolerance: 15
            - url: /mediocre-strict/
              lighthouse:
                  threshold:
                      threshold: 80
                      tolerance: 0
