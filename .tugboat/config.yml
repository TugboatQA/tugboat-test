services:
    apache:
        image: tugboatqa/httpd
        aliases: test
        http: true
        https: false
        commands:
            init:
                - echo "********** INIT **********"
                - ln -snf "${TUGBOAT_ROOT}" "${DOCROOT}"
            update:
                - echo "********** UPDATE **********"
            build:
                - echo "********** BUILD **********"
                - cat .tugboat/tugboat.txt
        lighthouse:
            enabled: true
            config:
                extends: lighthouse:default
                settings:
                    onlyCategories:
                        - seo
                        - accessibility
            threshold:
                - category: seo
                  threshold: 90
                - category: performance
                  threshold: 90
        urls:
            - /
            - /seo-bad/
            - /a11y-bad/
