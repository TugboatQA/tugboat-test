services:
    apache:
        image: tugboatqa/httpd
        aliases: test
        http: true
        https: false
        commands:
            init:
                - echo "********** INIT **********"
                - ln -snf "${TUGBOAT_ROOT}" "${DOCROOT}"
            update:
                - echo "********** UPDATE **********"
            build:
                - echo "********** BUILD **********"
                - cat .tugboat/tugboat.txt
        lighthouse:
            enabled: true
            threshold: 70
        urls:
            - url: /
            - url: /slow/
              lighthouse:
                  threshold: 95
            - url: /a11y-bad/
              lighthouse:
                  threshold: 95
            - url: /seo-bad/
              lighthouse:
                  threshold: 50
