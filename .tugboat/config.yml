services:
    apache:
        image: tugboatqa/httpd
        aliases: test
        http: true
        https: false
        commands:
            init:
                - echo "********** INIT **********"
                - ln -snf "${TUGBOAT_ROOT}" "${DOCROOT}"
            update:
                - echo "********** UPDATE **********"
            build:
                - echo "********** BUILD **********"
                - cat .tugboat/tugboat.txt
        lighthouse:
            enabled: true
            screen:
                - desktop
                - mobile
            threshold:
                desktop:
                    - category: performance
                      threshold: 90
                      tolerance: 5
                    - category: seo
                      threshold: 80
                mobile: base
        urls:
            - /
