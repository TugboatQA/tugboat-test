services:
  elasticsearch:
    default: true
    image: tugboatqa/elasticsearch:8.18.8
    http: true
    https: false
    environment:
      - ES_SETTING_DISCOVERY_TYPE=single-node
      - ES_SETTING_XPACK_SECURITY_ENABLED=false
      - ES_SETTING_XPACK_SECURITY_ENROLLMENT_ENABLED=false
      - ES_SETTING_NETWORK_HOST=0.0.0.0
    commands:
      init:
        - "TRYING THIS"
