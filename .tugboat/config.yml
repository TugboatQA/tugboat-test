services:
    apache:
        image: tugboatqa/httpd
        aliases: test
        http: true
        https: false
        commands:
            init:
                - echo "********** INIT **********"
                - ln -snf "${TUGBOAT_ROOT}" "${DOCROOT}"
            update:
                - echo "********** UPDATE **********"
            build:
                - echo "********** BUILD **********"
                - cat .tugboat/tugboat.txt
        lighthouse:
            enabled: true
            threshold: 60
        urls:
            - url: /
            - url: /checkout/
              lighthouse:
                  threshold:
                      desktop:
                          threshold: 95
                          tolerance: 0
