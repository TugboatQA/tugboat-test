services:
  go:
    image: tugboatqa/alpine
    aliases: test
    http: true
    https: false
    expose: 8080
    subpath: true
    commands:
      init:
        - apk update
        - apk add --no-cache --virtual .build-deps runit bash gcc musl-dev openssl go
        - mkdir -p /etc/service/server
        - cp "${TUGBOAT_ROOT}/.tugboat/runit/server/run" /etc/service/server/run
        - chmod +x /etc/service/server/run
      update:
        - echo "********** UPDATE **********"
      build:
        - echo "********** BUILD **********"
        - cd ${TUGBOAT_ROOT}/server && go build -o server .
        - cat .tugboat/tugboat.txt
      screenshot:
        enabled: true

        # The following options are used when taking a screenshot of
        # the URL for _this_ preview
        timeout: 30
        waitUntil:
          - load
        fullPage: false

      # Visual Diff settings that affect all of the defined service URLs.
      # These override our defaults, and can also be overridden per-URL
      visualdiff:
        # Visual Diffs depend on Screenshots being enabled. If Screenshots
        # are disabled for this Service, Visual Diffs are also disabled,
        # and this setting has no effect.
        enabled: true
        # The following options are used when taking a screenshot of
        # the URL for the _base_ preview
        timeout: 30
        waitUntil:
        - load
        fullPage: true
