<!DOCTYPE html>
<html>
  <head>
    <title>Parrot WebSocket Test</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div class="container">
      <h1>🦜 Parrot WebSocket Server</h1>
      <p>Send a message and watch it come back with a parrot emoji!</p>

      <div class="controls">
        <input
          type="text"
          id="messageInput"
          placeholder="Type your message here..."
        />
        <button id="sendButton">Send Message</button>
        <button id="connectButton">Connect</button>
        <button id="disconnectButton">Disconnect</button>
      </div>

      <div class="status" id="status">Disconnected</div>

      <div class="messages" id="messages"></div>
    </div>

    <script>
      // Store the WebSocket connection object
      let ws = null;

      // Get references to DOM elements
      const messageInput = document.getElementById("messageInput");
      const sendButton = document.getElementById("sendButton");
      const connectButton = document.getElementById("connectButton");
      const disconnectButton = document.getElementById("disconnectButton");
      const status = document.getElementById("status");
      const messages = document.getElementById("messages");

      // Function to add a message to the messages display
      function addMessage(text, isReceived = false) {
        const messageDiv = document.createElement("div");
        messageDiv.className = isReceived ? "message received" : "message sent";
        messageDiv.textContent = text;
        messages.appendChild(messageDiv);
        // Auto-scroll to bottom
        messages.scrollTop = messages.scrollHeight;
      }

      // Function to update the connection status
      function updateStatus(connected) {
        if (connected) {
          status.textContent = "Connected";
          status.className = "status connected";
          connectButton.disabled = true;
          disconnectButton.disabled = false;
          sendButton.disabled = false;
        } else {
          status.textContent = "Disconnected";
          status.className = "status disconnected";
          connectButton.disabled = false;
          disconnectButton.disabled = true;
          sendButton.disabled = true;
        }
      }

      // Function to connect to the WebSocket server
      function connect() {
        // Create a new WebSocket connection
        ws = new WebSocket(`ws://${window.location.hostname}/ws`);

        // Event handler: called when the connection is successfully established
        ws.onopen = function () {
          addMessage("Connected to server");
          updateStatus(true);
        };

        // Event handler: called when a message is received from the server
        ws.onmessage = function (event) {
          // event.data contains the message sent by the server
          addMessage("Server: " + event.data, true);
        };

        // Event handler: called when the connection is closed
        ws.onclose = function () {
          addMessage("Disconnected from server");
          updateStatus(false);
          ws = null;
        };

        // Event handler: called if there's an error with the connection
        ws.onerror = function (error) {
          addMessage("Error: " + error);
          updateStatus(false);
        };
      }

      // Function to send a message to the server
      function sendMessage() {
        const message = messageInput.value.trim();
        if (message && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(message);
          addMessage("You: " + message);
          messageInput.value = "";
        }
      }

      // Function to disconnect from the server
      function disconnect() {
        if (ws) {
          ws.close();
        }
      }

      // Set up event listeners for buttons
      connectButton.addEventListener("click", connect);
      disconnectButton.addEventListener("click", disconnect);
      sendButton.addEventListener("click", sendMessage);

      // Allow sending messages by pressing Enter
      messageInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          sendMessage();
        }
      });

      updateStatus(false);
    </script>
  </body>
</html>
